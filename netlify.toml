# =================================================================
# NETLIFY CONFIGURATION
# Tells Netlify how to build and serve sourdoughdatabase.com
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/
# =================================================================

[build]
  publish = "."
  # Cache-busting runs HERE, at deploy, not on Kyle's machine.
  #
  # stamp-assets.py rewrites every CSS/JS href to carry its file's content
  # hash. Done locally that meant a one-line CSS edit produced a 68-file
  # commit -- 66 of them a single hash bump -- and real changes hid among
  # them. Netlify's build image ships Python 3 by default, so it does the
  # rewriting on a fresh checkout instead and the stamps never get committed.
  #
  # If this command fails the deploy fails and the previous one stays live,
  # which is the right way round: it is loud rather than silently shipping
  # pages that can't reach a stale cache.
  command = "python3 scripts/stamp-assets.py"

# =================================================================
# SECURITY HEADERS
# These get applied to every page served from your site.
# =================================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Prevents clickjacking — no other site can embed yours in an iframe
    X-Frame-Options = "DENY"
    # Stops browsers from MIME-sniffing (a small XSS hardening)
    X-Content-Type-Options = "nosniff"
    # Limits how much referrer info leaks to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disables features your site doesn't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# =================================================================
# CACHING
# Asset filenames are NOT content-hashed (there's no build step), so
# nothing here may be marked "immutable" — a browser that caches
# styles.css as immutable would keep a stale copy for a year after a
# deploy, and there'd be no way to force it out.
#
# Instead: CSS/JS revalidate on every visit. With an ETag that's a
# ~200-byte 304 when nothing changed, and a correct file when it did.
# Images change rarely and can be cached for a week.
#
# If a build step with hashed filenames ever lands, THEN switch
# /assets/* back to "max-age=31536000, immutable".
# =================================================================
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# =================================================================
# REDIRECTS
# Netlify automatically serves 404.html for missing pages —
# no explicit rule needed.
# =================================================================
